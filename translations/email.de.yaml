booking:
  invoice:
    subject: 'Coworking Hahnheim: Deine Rechnung'
    salutation: 'Hallo %firstName%!'
    instructions: 'Vielen Dank für Deine Buchung. Deine Rechnung ist im Anhang zu dieser E-Mail.'
    explanation: 'Bitte überweise den Betrag spätestens 24 Stunden vor Buchungsdatum. Du kannst auch gerne Deine Rechnung direkt mit Paypal bezahlen. Klicke dazu einfach auf den oben stehenden Button:'
    signature: Viele Grüße!
    button_text: 'Mit Paypal bezahlen'
  cancel:
    subject: 'Coworking Hahnheim: Deine Buchung wurde storniert'
    salutation: 'Hallo %firstName%!'
    instructions: 'Deine Buchung vom %date% in %room% wurde storniert.'
    explanation: 'Hast Du die die Buchung bereits bezahlt? Dann wird dir der Betrag als Gutschein gutgeschrieben. Hast Du die Buchung noch nicht bezahlt, wird sie durch eine entsprechende Gutschrift storniert.'
    signature: 'Vielen Dank!'
    button_text: 'Neue Buchung'
  first:
    subject: 'Coworking Hahnheim: Deine erste Buchung'
    salutation: 'Hallo %firstName%!'
    instructions: 'Vielen Dank für Deine erste Buchung. Wir freuen uns auf Deinen Besuch!<br> Deine Rechnung erhälts Du in einer gesonderten Mail.'
    explanation: '🕘 Das Coworking ist von 9-18 Uhr geöffnnet. <br>
    🅿️ Eigene Parklpätze sind keine vorhanden, es sollte aber nicht schwierige sein einen zu finden.<br>
    ☕️ Unsere Küche ist ausgestattet mit Kaffeemaschine (und Wasserkocher mit Tee-Auswahl für die Tee-Liebhaber), Kühlschrank, Mikrowelle, Backofen und Geschirr. <br>
    🥗 Du kannst gerne Dein Essen mitbringen.<br>
    🥛 Es gibt stilles Wasser und einen Sodastream für diejenigen die es gerne bizzelnd haben.<br>
    🚿 Für die Sportlichen, die mit dem Fahhrad kommen, haben wir auch eine Dusche. <br>'
    signature: 'Wir freuen uns auf Dich!'

voucher:
  invoice:
    subject: 'Coworking Hahnheim: Deine Rechnung'
    salutation: 'Hallo %firstName%!'
    instructions: 'Vielen Dank für Deinen Kauf! Deine Rechnung ist im Anhang zu dieser E-Mail. '
    explanation: 'So lange die Rechnung nicht bezahlt ist, sind die Gutscheine nicht gültig. Du kannst auch gerne Deine Rechnung direkt mit Paypal bezahlen. Klicke dazu einfach auf den oben stehenden Button:'
    signature: Viele Grüße!
    button_text: 'Mit Paypal bezahlen'

reset_password:
    subject: 'Coworking Hahnheim: Dein Passwort zurücksetzen'
    salutation: Hallo %firstName%!
    instructions: Um Dein Passwort zurückzusetzen, klicke auf den folgenden Button
    explanation: 'Dieser Link ist %timeLimit% lang gültig'
    signature: Viele Grüße!
    button_text: 'Passwort zurück setzten'

registration:
  email_verification:
    subject: 'Coworking Hahnheim: Bitte bestätige Deine E-Mail-Adresse'
    salutation: Hallo %firstName%!
    instructions: Bitte bestätige Deine E-Mail-Adresse, indem Du auf den folgenden Link klickst.
    explanation: 'Dieser Link ist %timeLimit% lang gültig.'
    signature: Viele Grüße!
    button_text: E-Mail-Adresse bestätigen

withdrawal:
  receipt:
    subject: 'Coworking Hahnheim: Eingangsbestätigung Deines Widerrufs'
    salutation: 'Hallo %name%!'
    instructions: 'Wir haben Deinen Widerruf am %date% um %time% Uhr erhalten.<br><br>
    Inhalt Deiner Erklärung:<br>
    „Hiermit widerrufe ich den von mir abgeschlossenen Vertrag %contract%.“<br>
    Name: %name%<br>
    E-Mail: %email%<br>
    Vertrag: %contract%'
    explanation: 'Wir bearbeiten Deinen Widerruf und melden uns bei Dir, sobald er abgeschlossen ist.'
    signature: 'Viele Grüße!'
  result:
    salutation: 'Hallo %name%!'
    explanation: 'Wenn Du Fragen hast, melde Dich gerne bei uns.'
    signature: 'Viele Grüße!'
    reason:
      performed: 'Der gebuchte Tag hat bereits stattgefunden, die Leistung wurde vollständig erbracht. Damit ist Dein Widerrufsrecht erloschen (§ 356 Abs. 4 BGB).'
      already_cancelled: 'Die Buchung wurde bereits storniert.'
      vouchers_used: 'Alle Gutscheine dieser Rechnung wurden bereits eingelöst, die Leistung wurde vollständig erbracht. Damit ist Dein Widerrufsrecht erloschen (§ 356 Abs. 4 BGB).'
  processed:
    subject: 'Coworking Hahnheim: Dein Widerruf wurde bearbeitet'
    instructions: 'wir haben Deinen Widerruf vom %date% für den Vertrag %contract% bearbeitet.'
    refund:
      none: 'Eine Erstattung ist nicht nötig.'
      reversal: 'Du hattest die Rechnung noch nicht bezahlt. Wir haben sie storniert, Du musst nichts bezahlen.'
      voucher: 'Du hattest mit Gutscheinen bezahlt. Diese Gutscheine sind wieder gültig und Du kannst sie für eine andere Buchung einlösen.'
      paypal: 'Wir erstatten Dir %amount% € über PayPal, so wie Du bezahlt hast. Das Geld ist spätestens 14 Tage nach Eingang Deines Widerrufs bei Dir.'
      transaction: 'Wir überweisen Dir %amount% € auf das Konto, von dem Du bezahlt hast. Das Geld ist spätestens 14 Tage nach Eingang Deines Widerrufs bei Dir.'
    value_compensation: 'Für die bereits eingelösten Gutscheine behalten wir anteilig %amount% € als Wertersatz ein. Die übrigen Gutscheine sind nicht mehr gültig.'
  rejected:
    subject: 'Coworking Hahnheim: Dein Widerruf'
    instructions: 'wir haben Deinen Widerruf vom %date% für den Vertrag %contract% geprüft und können ihn leider nicht annehmen.<br><br>
    Begründung: %reason%'

invoice:
  withdrawal: 'Informationen zu Deinem Widerrufsrecht findest Du in unserer <a href="%policyLink%">Widerrufsbelehrung</a>. Widerrufen kannst Du über <a href="%withdrawalLink%">Vertrag widerrufen</a>.'
