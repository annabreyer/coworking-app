page:
  title: Welcome

content:
  prices:
    intro: '
      <h2>Prices</h2>
      <p class="text-lg">Our prices are fair and transparent. We offer different rates to suit your needs. Whether you only need a workspace occasionally or a fixed desk regularly, we have the right offer for you.
      And if you do not find what you are looking for, just talk to us. By e-mail or, even better, in person. We will find a solution.</p>'
    unitary:
      title: 'Single booking %type%: %unitaryPrice% €'
    voucher:
      title: '%voucherName% : %voucherPrice% €'
      text: '
      <p class="text-lg">A multi-pass consists of voucher codes that you can use to pay for your booking.</br>
      The voucher codes are valid for 6 months and are not transferable. Only you can use them for payment.
      </p>'
  details: '
      <hr>
      <h2>Booking</h2>
      <p class="text-lg">Once you have created an account (<a href="%registerUrl%" class="underline">Registration</a>), you can book your workspace through our booking portal here on the website.
      Simply choose the day you want. </br>
      <strong>Please note: your booking is only valid once it has been paid in full.</strong></p>
      <h3>Payment</h3>
      <p class="text-lg">You can pay directly with PayPal or by invoice. When paying by invoice, the amount should be received at least 24 hours before the booking date. If you already bought a multi-pass, you can use it for your booking. </br>
      Once your booking is complete, you will receive a confirmation by e-mail. </p>

      <h3>Cancellation</h3>
      <p class="text-lg">You can cancel your booking up to 24 hours in advance. </p>

      <hr>
      <h2>User account</h2>
      <p class="text-lg">In your user account you can see your bookings and vouchers and manage your data. </br>
      You can pay your open invoices with PayPal and download the invoices for your bookings and vouchers. </p>
      <hr>
      <h2>Opening hours</h2>
      <p class="text-lg">You can work with us Monday to Friday from 9:00 to 18:00. If you would like to work outside these hours, just talk to us. We will find a solution.</p>

      <hr>

      <h2>Contact</h2>
      <p class="text-lg">You have a question or would like to visit us? Write to us! We are happy to help. <a href="mailto:office@coworking-hahnheim.de" class="underline">office@coworking-hahnheim.de</a></p>'

actions:
  booking: Book now
  user_dashboard: Go to user account

